set -g extended-keys-format csi-u
set -g extended-keys on
set -g mouse on
set -g status-position top

# desktop notif passthrough (OSC 9) + bell monitor
set -g allow-passthrough on
set -g monitor-bell on
set -g focus-events on

set -g base-index 1
set -g pane-base-index 1

set -s theme dark
set -s dark-theme-black '#171922'
set -s dark-theme-white '#e4f0fb'
set -s dark-theme-light-grey '#767c9d'
set -s dark-theme-dark-grey '#303340'
set -s dark-theme-green '#5de4c7'
set -s dark-theme-yellow '#fffac2'
set -s dark-theme-red '#d0679d'
set -s dark-theme-blue '#89ddff'
set -s dark-theme-cyan '#add7ff'
set -s dark-theme-magenta '#fcc5e9'

# status bar: cwd left, windows centered. System stats live in the notch.
set -g status-style 'bg=default,fg=#e4f0fb'
set -g status-justify absolute-centre
set -g status-left-length 100
set -g status-left '#[fg=#5de4c7]  #{=-40:#{s|^/home/[^/]*|~|:pane_current_path}} '
set -g status-right ''
set -g window-status-separator ''
set -g window-status-style 'fg=#767c9d'
set -g window-status-format ' #I:#W '
set -g window-status-current-style 'fg=#ffffff,bold'
set -g window-status-current-format ' #I:#W '
set -g window-status-bell-style 'fg=#d0679d,bold'
set -g pane-border-style 'fg=#506477'
set -g pane-active-border-style 'fg=#89ddff'
set -g message-style 'bg=#ffffff,fg=#171922'
set -g message-command-style 'bg=#ffffff,fg=#171922,fill=#ffffff'
set -g mode-style 'bg=#ffffff,fg=#171922'
set -g menu-selected-style 'bg=#ffffff,fg=#171922'
