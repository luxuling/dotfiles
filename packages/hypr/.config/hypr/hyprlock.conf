# NOTE: same monochrome look as the quickshell notch: GrokNight grays, Maple Mono, blurred wallpaper.
$ink = rgb(e1e1e1)
$muted = rgb(6c6c6c)
$crust = rgb(141414)
$font = Maple Mono NF CN

general {
    hide_cursor = true
}

background {
    monitor =
    path = ~/.config/hypr/wallpaper.jpg
    blur_passes = 3
    blur_size = 8
    brightness = 0.5
}

label {
    monitor =
    text = cmd[update:30000] date +"%H:%M"
    color = $ink
    font_size = 96
    font_family = $font
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = $muted
    font_size = 18
    font_family = $font
    position = 0, 40
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 48
    outline_thickness = 1
    rounding = 14
    dots_size = 0.2
    dots_spacing = 0.3
    outer_color = $muted
    inner_color = $crust
    font_color = $ink
    font_family = $font
    check_color = $ink
    fail_color = $ink
    capslock_color = $ink
    fade_on_empty = false
    placeholder_text = <span foreground="##6c6c6c">$USER</span>
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    position = 0, -40
    halign = center
    valign = center
}
